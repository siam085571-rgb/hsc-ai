<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Link Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 30px 15px; display: flex; justify-content: center; }
        .admin-card { background: #1e293b; width: 100%; max-width: 550px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h2 { text-align: center; margin-bottom: 20px; color: #6366f1; }
        .form-group { margin-bottom: 15px; }
        label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; outline: none; }
        input:focus { border-color: #6366f1; }
        .btn { width: 100%; padding: 12px; background: #6366f1; border: none; border-radius: 8px; color: #fff; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn:hover { background: #4f46e5; }
        .links-title { margin-top: 30px; font-size: 16px; border-bottom: 1px solid #334155; padding-bottom: 8px; margin-bottom: 15px; }
        .link-item { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
        .del-btn { background: #ef4444; color: #fff; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .del-btn:hover { background: #dc2626; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>Link Manager</h2>
        
        <div class="form-group">
            <label>PDF Name / Title</label>
            <input type="text" id="pdfTitle" placeholder="যেমন: পদার্থবিজ্ঞান ১ম পত্র নোট">
        </div>
        <div class="form-group">
            <label>Google Drive URL</label>
            <input type="url" id="pdfUrl" placeholder="https://drive.google.com/file/d/...">
        </div>
        <button class="btn" onclick="addLink()"><i class="fa-solid fa-plus"></i> Add Link</button>

        <div class="links-title">Current Links in Main Repo:</div>
        <div id="linkListContainer">Loading...</div>
    </div>

    <script>
        // পেজ লোড হলেই লিংকগুলো ফেচ করা হবে
        window.onload = function() {
            fetchLinks();
        };

        async function fetchLinks() {
            const res = await fetch('/api/links');
            const data = await res.json();

            const container = document.getElementById('linkListContainer');
            container.innerHTML = '';

            if(!data.links || data.links.length === 0) {
                container.innerHTML = '<p style="color:#64748b;">No links found.</p>';
                return;
            }

            data.links.forEach(item => {
                container.innerHTML += `
                    <div class="link-item">
                        <div>
                            <strong>${item.title}</strong><br>
                            <small style="color:#64748b">${item.url.substring(0, 35)}...</small>
                        </div>
                        <button class="del-btn" onclick="deleteLink('${item.url}')"><i class="fa-solid fa-trash"></i> Delete</button>
                    </div>
                `;
            });
        }

        async function addLink() {
            const title = document.getElementById('pdfTitle').value;
            const url = document.getElementById('pdfUrl').value;

            if(!title || !url) return alert('Both fields required!');

            const res = await fetch('/api/links/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, url })
            });

            const data = await res.json();
            alert(data.message || data.error);
            document.getElementById('pdfTitle').value = '';
            document.getElementById('pdfUrl').value = '';
            fetchLinks();
        }

        async function deleteLink(url) {
            if(!confirm('Are you sure you want to delete this link?')) return;

            const res = await fetch('/api/links/delete', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url })
            });

            const data = await res.json();
            alert(data.message || data.error);
            fetchLinks();
        }
    </script>
</body>
</html>
